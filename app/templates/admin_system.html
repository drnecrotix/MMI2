<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMI2 System</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#08101d;--panel:#101a2b;--border:#263750;--text:#eef5ff;--muted:#93a5bd;--accent:#4f7cff;--ok:#91e3a1;--warn:#ffb477;--bad:#ff7d88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1180px;margin:auto;padding:24px 16px 48px}a{color:#9bb4ff}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px}.muted{color:var(--muted)}button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#0a1423;border:1px solid var(--border);border-radius:14px;padding:14px}.metric small{color:var(--muted);display:block;margin-bottom:6px}.metric strong{font-size:18px;word-break:break-word}.checks{display:grid;gap:9px}.check{display:flex;gap:12px;align-items:flex-start;background:#0a1423;border:1px solid var(--border);border-radius:13px;padding:13px}.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:0 0 auto}.dot.ok{background:var(--ok)}.dot.warning{background:var(--warn)}.dot.error{background:var(--bad)}.check strong{display:block}.check span{color:var(--muted);font-size:14px}.status{font-size:22px;font-weight:900}.status.healthy{color:var(--ok)}.status.warning{color:var(--warn)}.status.error{color:var(--bad)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kv{display:grid;grid-template-columns:minmax(130px,0.7fr) 1.3fr;gap:8px 12px;margin-top:10px}.kv div:nth-child(odd){color:var(--muted)}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#cfe0ff}.hidden{display:none}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv div:nth-child(odd){margin-top:8px}}@media(max-width:480px){.summary{grid-template-columns:1fr}}</style></head>
<body><main>
<div class="top"><div><h1>System Diagnostics</h1><p class="muted">Production readiness за MMI2. Не се показват пароли, JWT secret или database connection string.</p></div><div><a href="/admin">← Admin</a> · <a href="#" onclick="logout()">Изход</a></div></div>
<section class="card"><div class="top"><div><div id="overall" class="status">Проверка...</div><div id="generated" class="muted"></div></div><button id="refreshButton" onclick="loadDiagnostics()">Обнови</button></div></section>
<section class="card"><div id="summary" class="summary"></div></section>
<div class="grid2"><section class="card"><h2>Среда</h2><div id="environment" class="kv"></div></section><section class="card"><h2>Database</h2><div id="database" class="kv"></div></section></div>
<section class="card"><h2>Проверки</h2><div id="checks" class="checks"></div></section>
<section class="card"><h2>Update / Backup</h2><div id="updateInfo" class="kv"></div></section>
<script>
const STORAGE='mmi2_admin_token';const token=()=>sessionStorage.getItem(STORAGE);const auth=()=>({Authorization:`Bearer ${token()}`});
function logout(){sessionStorage.removeItem(STORAGE);location.replace('/admin/login')}
function esc(v){return String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function guard(){if(!token())return logout();const r=await fetch('/api/v1/admin/me',{headers:auth()});if(!r.ok)return logout();const d=await r.json();if(d.role==='moderator')location.replace('/admin')}
function kv(rows){return rows.map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('')}
function labelStatus(s){return s==='healthy'?'Системата е готова':s==='warning'?'Има предупреждения':'Има критичен проблем'}
async function loadDiagnostics(){refreshButton.disabled=true;overall.className='status';overall.textContent='Проверка...';try{const r=await fetch('/api/v1/admin/system/diagnostics',{headers:auth()});if(r.status===401)return logout();const d=await r.json();if(!r.ok)throw new Error(d.detail||'Diagnostic check failed.');overall.className=`status ${d.status}`;overall.textContent=labelStatus(d.status);generated.textContent=`Последна проверка: ${new Date(d.generated_at).toLocaleString('bg-BG')}`;summary.innerHTML=[['Версия',`v${d.version.app}`],['Build',`PR #${d.version.current_pr}`],['Hosting',d.hosting.label],['Свободно място',d.storage.free_human]].map(([a,b])=>`<div class="metric"><small>${esc(a)}</small><strong>${esc(b)}</strong></div>`).join('');environment.innerHTML=kv([['Runtime',d.hosting.label],['Entry point',d.hosting.entrypoint],['Python',`${d.python.implementation} ${d.python.version}`],['Project writable',d.storage.project_writable?'Да':'Не'],['Update writable',d.storage.update_writable?'Да':'Не'],['Installer lock',d.installer.lock_present?'Наличен':'Липсва']]);const li=d.database.latest_import;database.innerHTML=kv([['Driver',d.database.driver],['Connection',d.database.connected?'OK':'Грешка'],['Alembic current',d.database.migration_current||'none'],['Alembic head',d.database.migration_head||'none'],['Schema current',d.database.schema_current?'Да':'Не'],['Служители',d.database.employees??'-'],['Admin акаунти',d.database.admin_accounts??'-'],['Последен импорт',li?`${li.period} · ${new Date(li.imported_at).toLocaleString('bg-BG')}`:'Няма']]);checks.innerHTML=d.checks.map(c=>`<div class="check"><span class="dot ${esc(c.status)}"></span><div><strong>${esc(c.label)}</strong><span>${esc(c.detail)}</span></div></div>`).join('');updateInfo.innerHTML=kv([['Self-update state',d.update.status||'ready'],['Target PR',d.update.target_pr?`#${d.update.target_pr}`:'-'],['Backup mode',d.backup.mode],['Backup ready',d.backup.ready?'Да':'Не'],['Backup detail',d.backup.detail]]);}catch(e){overall.className='status error';overall.textContent='Diagnostic check failed';generated.textContent=e.message}finally{refreshButton.disabled=false}}
(async()=>{await guard();await loadDiagnostics()})();
</script></main></body></html>
