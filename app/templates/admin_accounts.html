<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMI2 - Акаунти</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#08101d;--panel:#101a2b;--border:#263750;--text:#eef5ff;--muted:#93a5bd;--accent:#4f7cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1100px;margin:auto;padding:24px 16px 48px}a{color:#9bb4ff}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px}input,select,button{font:inherit}input,select{background:#091321;color:#fff;border:1px solid #32445f;border-radius:10px;padding:10px}button{border:0;border-radius:10px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#273a55}.danger{background:#7e3040}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}.muted{color:var(--muted)}.status{margin-top:10px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #22334a;text-align:left;font-size:13px}th{background:#111d30}.badge{padding:4px 8px;border:1px solid var(--border);border-radius:999px}.hidden{display:none}</style></head><body><main>
<p><a href="/admin">← Към админ панела</a> · <a href="#" onclick="logout()">Изход</a></p><h1>Администраторски акаунти</h1><p class="muted">Owner е единствен и не може да бъде понижаван или деактивиран. Новите профили могат да бъдат admin или moderator.</p>
<section class="card"><h2>Нов акаунт</h2><div class="row"><input id="email" type="email" placeholder="Имейл"><input id="password" type="password" minlength="10" placeholder="Парола - минимум 10 знака"><select id="role"><option value="admin">Admin</option><option value="moderator">Moderator</option></select><button onclick="createAccount()">Създай</button></div><div id="status" class="status"></div></section>
<section class="card"><h2>Акаунти</h2><div class="wrap"><table><thead><tr><th>Имейл</th><th>Роля</th><th>Статус</th><th>Последен вход</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>
const STORAGE='mmi2_admin_token';const token=()=>sessionStorage.getItem(STORAGE);const auth=(json=false)=>Object.assign({Authorization:`Bearer ${token()}`},json?{'Content-Type':'application/json'}:{});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function logout(){sessionStorage.removeItem(STORAGE);location.replace('/admin/login')}function unauth(r){if(r.status===401){logout();return true}return false}
async function guard(){if(!token())return logout();const r=await fetch('/api/v1/admin/me',{headers:auth()});if(unauth(r))return;const d=await r.json();if(!r.ok||d.role!=='owner'){location.replace('/admin');return}loadAccounts()}
async function api(url,opt={}){opt.headers=Object.assign(auth(Boolean(opt.body)),opt.headers||{});const r=await fetch(url,opt);if(unauth(r))throw new Error('Сесията е изтекла.');const d=await r.json();if(!r.ok)throw new Error(d.detail||'Грешка');return d}
async function createAccount(){try{const d=await api('/api/v1/admin/accounts',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value,role:role.value})});status.textContent=`Създаден ${d.account.role}: ${d.account.email}`;email.value='';password.value='';loadAccounts()}catch(e){status.textContent=e.message}}
async function setRole(id,value){try{await api(`/api/v1/admin/accounts/${id}`,{method:'PATCH',body:JSON.stringify({role:value})});loadAccounts()}catch(e){status.textContent=e.message}}
async function toggle(id,active){try{await api(`/api/v1/admin/accounts/${id}`,{method:'PATCH',body:JSON.stringify({is_active:active})});loadAccounts()}catch(e){status.textContent=e.message}}
async function resetPassword(id){const p=prompt('Нова парола - минимум 10 знака:');if(!p)return;try{await api(`/api/v1/admin/accounts/${id}/password`,{method:'PUT',body:JSON.stringify({password:p})});status.textContent='Паролата е обновена.'}catch(e){status.textContent=e.message}}
async function loadAccounts(){try{const d=await api('/api/v1/admin/accounts');rows.innerHTML=d.accounts.map(a=>{const owner=a.role==='owner';const roleControl=owner?'<span class="badge">owner</span>':`<select onchange="setRole(${a.id},this.value)"><option value="admin" ${a.role==='admin'?'selected':''}>admin</option><option value="moderator" ${a.role==='moderator'?'selected':''}>moderator</option></select>`;const toggleButton=owner?'':`<button class="secondary" onclick="toggle(${a.id},${!a.is_active})">${a.is_active?'Деактивирай':'Активирай'}</button>`;return `<tr><td>${esc(a.email)}</td><td>${roleControl}</td><td>${a.is_active?'Активен':'Неактивен'}</td><td>${a.last_login_at?new Date(a.last_login_at).toLocaleString('bg-BG'):'-'}</td><td>${toggleButton} <button onclick="resetPassword(${a.id})">Нова парола</button></td></tr>`}).join('')}catch(e){status.textContent=e.message}}
guard();
</script></main></body></html>
