<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <style>
    :root{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color-scheme:dark;
      --bg:#08101d;--panel:#101a2b;--border:#263750;--text:#eef5ff;--muted:#93a5bd;--accent:#4f7cff;
      --day:#f2b84b;--night:#6ea8ff;--leave:#b987ff;--sick:#ff6f7d;--rest:#6f8096;--unknown:#ff995e;
      --pred-work:#67d4a6;--pred-rest:#8290a4;--warning:#f5c86a;
    }
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#12213a 0,#08101d 42%);color:var(--text)}
    button,input{font:inherit}button{cursor:pointer}main{width:min(1180px,100%);margin:auto;padding:28px 18px 50px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand h1{font-size:clamp(24px,5vw,36px);margin:0;letter-spacing:-.03em}.brand p{margin:5px 0 0;color:var(--muted)}
    .card{background:rgba(16,26,43,.94);border:1px solid var(--border);border-radius:22px;box-shadow:0 20px 60px #0006}.hidden{display:none!important}
    .login{max-width:520px;margin:8vh auto 0;padding:30px}.login h2{margin:0 0 8px}.login p{color:var(--muted);margin:0 0 22px}
    label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid #32445f;background:#091321;color:#fff;border-radius:13px;padding:14px 15px;outline:none}input:focus{border-color:#6e92ff;box-shadow:0 0 0 3px #4f7cff22}
    .primary{width:100%;margin-top:12px;border:0;border-radius:13px;padding:14px 16px;background:var(--accent);color:#fff;font-weight:800}.message{min-height:22px;color:#ff9ca7;margin:12px 0 0;font-size:14px}
    .dashboard{display:grid;gap:18px}.profile{padding:20px 22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}.profile-name{font-size:22px;font-weight:850}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #32445f;background:#0b1525;border-radius:999px;padding:7px 10px;color:#bdcbe0;font-size:13px}.team{color:#fff;font-weight:850}.logout{width:auto;border:1px solid #3a4a62;background:transparent;color:#cad6e8;padding:10px 14px;border-radius:11px}
    .calendar-card{padding:18px}.calendar-head{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px;margin-bottom:16px}.nav{border:1px solid #31435d;background:#0b1525;color:#fff;border-radius:11px;height:42px;font-size:20px}#monthTitle{text-align:center;font-size:21px;font-weight:850;text-transform:capitalize}
    .notice{display:flex;gap:12px;align-items:flex-start;border:1px solid #846a2c;background:#2b2414;border-radius:14px;padding:13px 15px;margin:0 0 16px;color:#f4dfaa}.notice strong{display:block;color:#ffe6a0;margin-bottom:3px}.notice small{display:block;color:#cdbd94;margin-top:5px}.notice-icon{font-size:20px;line-height:1.2}
    .weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekday{text-align:center;padding:5px 0 8px;color:#8193ac;font-size:12px;font-weight:800}
    .day{position:relative;min-height:108px;border:1px solid #283a54;border-radius:14px;background:#0a1423;padding:10px;overflow:hidden}.day.empty{background:transparent;border-color:transparent}.day.today{outline:2px solid #fff8;outline-offset:1px}.date{font-size:13px;color:#8fa1ba;font-weight:800}.shift-code{font-size:27px;font-weight:900;line-height:1;margin-top:13px}.shift-label{margin-top:7px;font-size:12px;font-weight:750;color:#cbd6e5}
    .type-day{border-color:#f2b84b77;background:#2a2113}.type-day .shift-code{color:var(--day)}.type-night{border-color:#6ea8ff77;background:#101d31}.type-night .shift-code{color:var(--night)}.type-leave{border-color:#b987ff77;background:#20162e}.type-leave .shift-code{color:var(--leave)}.type-sick_leave{border-color:#ff6f7d77;background:#2b151b}.type-sick_leave .shift-code{color:var(--sick)}.type-rest{opacity:.72}.type-rest .shift-code{color:var(--rest);font-size:22px}.type-unknown{border-color:#ff995e77}.type-unknown .shift-code{color:var(--unknown)}
    .type-predicted_work{border:1px dashed #67d4a699;background:#10251f}.type-predicted_work .shift-code{color:var(--pred-work)}.type-predicted_rest{border:1px dashed #8290a477;background:#111923;opacity:.82}.type-predicted_rest .shift-code{color:var(--pred-rest);font-size:22px}.type-missing{border-style:dashed;opacity:.55}.type-missing .shift-code{color:var(--muted);font-size:18px}
    .estimated-tag{position:absolute;top:8px;right:8px;font-size:9px;font-weight:850;letter-spacing:.05em;color:#a9e4cc;background:#17352c;border:1px solid #2e6f59;border-radius:999px;padding:3px 5px}
    .legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin:18px 0 4px}.legend span{display:inline-flex;gap:7px;align-items:center;color:#b7c5d9;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:currentColor}.legend-estimated{border-left:1px solid #394960;padding-left:14px}
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.stat{background:#0a1423;border:1px solid #263750;padding:12px;border-radius:13px;text-align:center}.stat strong{display:block;font-size:20px}.stat small{color:#8da0ba}.source-note{margin-top:12px;color:#7f92ab;font-size:12px;text-align:right}
    @media(max-width:700px){main{padding:18px 10px 35px}.topbar{margin-bottom:16px}.calendar-card{padding:11px}.weekdays,.calendar{gap:4px}.day{min-height:82px;padding:7px;border-radius:10px}.shift-code{font-size:21px;margin-top:9px}.shift-label{display:none}.estimated-tag{display:none}.summary{grid-template-columns:repeat(2,1fr)}.weekday{font-size:10px}.profile{padding:16px}.notice{font-size:13px}}
  </style>
</head>
<body>
<main>
  <div class="topbar"><div class="brand"><h1>MMI2 График</h1><p>Персонален месечен работен календар</p></div></div>

  <section id="loginView" class="card login">
    <h2>Виж своя график</h2>
    <p>Въведи работния си номер. Ще бъдат показани само данните за твоя график.</p>
    <label for="workNumber">Работен номер</label>
    <input id="workNumber" inputmode="numeric" autocomplete="off" placeholder="Напр. 12345">
    <button class="primary" id="loginButton" onclick="loginAndLoad()">Вход</button>
    <div id="loginMessage" class="message"></div>
  </section>

  <div id="scheduleView" class="dashboard hidden">
    <section class="card profile">
      <div>
        <div id="employeeName" class="profile-name"></div>
        <div class="meta">
          <span class="pill">Раб. № <strong id="employeeNumber"></strong></span>
          <span class="pill">Смяна <strong id="employeeTeam" class="team">-</strong></span>
        </div>
      </div>
      <button class="logout" onclick="logout()">Изход</button>
    </section>

    <section class="card calendar-card">
      <div class="calendar-head">
        <button class="nav" aria-label="Предишен месец" onclick="changeMonth(-1)">‹</button>
        <div id="monthTitle"></div>
        <button class="nav" aria-label="Следващ месец" onclick="changeMonth(1)">›</button>
      </div>

      <div id="scheduleNotice" class="notice hidden">
        <div class="notice-icon">⚠</div>
        <div><strong>Графикът не е обновен</strong><span id="noticeText"></span><small id="noticeMeta"></small></div>
      </div>

      <div class="weekdays">
        <div class="weekday">ПОН</div><div class="weekday">ВТО</div><div class="weekday">СРЯ</div><div class="weekday">ЧЕТ</div><div class="weekday">ПЕТ</div><div class="weekday">СЪБ</div><div class="weekday">НЕД</div>
      </div>
      <div id="calendar" class="calendar"></div>

      <div class="legend">
        <span style="color:var(--day)"><i class="dot"></i>Дневна</span>
        <span style="color:var(--night)"><i class="dot"></i>Нощна</span>
        <span style="color:var(--leave)"><i class="dot"></i>Отпуск</span>
        <span style="color:var(--sick)"><i class="dot"></i>Болничен</span>
        <span style="color:var(--rest)"><i class="dot"></i>Почивка</span>
        <span id="estimatedLegend" class="legend-estimated hidden" style="color:var(--pred-work)"><i class="dot"></i>Прогнозен 2×2</span>
      </div>
      <div id="summary" class="summary"></div>
      <div id="sourceNote" class="source-note"></div>
    </section>
  </div>
</main>
<script>
const now=new Date();
let token=null;
let currentYear=now.getFullYear();
let currentMonth=now.getMonth()+1;

document.getElementById('workNumber').addEventListener('keydown',e=>{if(e.key==='Enter')loginAndLoad();});

const labels={
  day:'Дневна смяна',night:'Нощна смяна',leave:'Отпуск',sick_leave:'Болничен',rest:'Почивка',unknown:'Неизвестен код',
  predicted_work:'Работа - прогнозно',predicted_rest:'Почивка - прогнозно',missing:'Няма данни'
};
const displayCodes={day:'1',night:'2',leave:'О',sick_leave:'Б',rest:'•',predicted_work:'≈',predicted_rest:'•',missing:'—'};

async function loginAndLoad(){
  const workNumber=document.getElementById('workNumber').value.trim();
  const message=document.getElementById('loginMessage');
  if(!workNumber){message.textContent='Въведи работен номер.';return;}
  const button=document.getElementById('loginButton');message.textContent='';button.disabled=true;button.textContent='Проверка...';
  try{
    const response=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({work_number:workNumber})});
    const auth=await response.json();if(!response.ok)throw new Error(auth.detail||'Служителят не е намерен.');
    token=auth.access_token;employeeName.textContent=auth.employee_name;employeeNumber.textContent=auth.work_number;employeeTeam.textContent=auth.team||'-';
    loginView.classList.add('hidden');scheduleView.classList.remove('hidden');await loadSchedule();
  }catch(error){message.textContent=error.message;}finally{button.disabled=false;button.textContent='Вход';}
}

async function loadSchedule(){
  if(!token)return;
  const response=await fetch(`/api/v1/me/schedule/${currentYear}/${currentMonth}`,{headers:{Authorization:`Bearer ${token}`}});
  const data=await response.json();if(!response.ok){alert(data.detail||'Грешка при зареждане на графика.');return;}
  employeeName.textContent=data.employee_name;employeeNumber.textContent=data.work_number;employeeTeam.textContent=data.team||'-';renderCalendar(data);
}

function renderCalendar(data){
  const monthDate=new Date(data.year,data.month-1,1);monthTitle.textContent=monthDate.toLocaleDateString('bg-BG',{month:'long',year:'numeric'});
  const root=document.getElementById('calendar');root.innerHTML='';
  const lookup=Object.fromEntries(data.shifts.map(s=>[Number(s.work_date.slice(-2)),s]));
  const days=new Date(data.year,data.month,0).getDate();
  const firstWeekday=(new Date(data.year,data.month-1,1).getDay()+6)%7;
  for(let i=0;i<firstWeekday;i++){const blank=document.createElement('div');blank.className='day empty';root.appendChild(blank);}

  const totals={day:0,night:0,leave:0,sick_leave:0,rest:0,predicted_work:0,predicted_rest:0,missing:0};
  for(let d=1;d<=days;d++){
    const shift=lookup[d]||{shift_type:'missing',raw_code:'',estimated:false};
    totals[shift.shift_type]=(totals[shift.shift_type]||0)+1;
    const el=document.createElement('div');el.className=`day type-${shift.shift_type}`;
    if(data.year===now.getFullYear()&&data.month===now.getMonth()+1&&d===now.getDate())el.classList.add('today');
    const code=shift.raw_code||displayCodes[shift.shift_type]||'?';
    el.innerHTML=`<div class="date">${d}</div>${shift.estimated?'<span class="estimated-tag">ПРОГНОЗА</span>':''}<div class="shift-code">${escapeHtml(code)}</div><div class="shift-label">${labels[shift.shift_type]||shift.shift_type}</div>`;
    root.appendChild(el);
  }

  renderNotice(data);
  renderSummary(data,totals);
}

function renderNotice(data){
  if(data.is_estimated){
    scheduleNotice.classList.remove('hidden');estimatedLegend.classList.remove('hidden');noticeText.textContent=data.warning||'Показан е ориентировъчен автоматичен график 2 на 2.';
    const confidence={high:'висока',medium:'средна',low:'ниска'}[data.fallback_confidence]||data.fallback_confidence||'неизвестна';
    const basis=data.fallback_basis==='history'?'по последния наличен официален график':data.fallback_basis==='team'?'по постоянната смяна':'по базов 2×2 цикъл';
    noticeMeta.textContent=`Фаза: ${basis}. Оценена увереност: ${confidence}.`;
    sourceNote.textContent='Източник: автоматичен 2×2 fallback - не е официален график.';
  }else{
    scheduleNotice.classList.add('hidden');estimatedLegend.classList.add('hidden');noticeText.textContent='';noticeMeta.textContent='';sourceNote.textContent='Източник: импортиран график.';
  }
}

function renderSummary(data,t){
  if(data.is_estimated){
    summary.innerHTML=stat(t.predicted_work,'Прогнозни работни')+stat(t.predicted_rest,'Прогнозни почивки')+stat(t.missing,'Без данни');
  }else{
    summary.innerHTML=stat(t.day,'Дневни')+stat(t.night,'Нощни')+stat(t.leave,'Отпуск')+stat(t.sick_leave,'Болнични')+stat(t.rest,'Почивки')+(t.missing?stat(t.missing,'Без данни'):'');
  }
}
function stat(value,label){return `<div class="stat"><strong>${value||0}</strong><small>${label}</small></div>`;}

function changeMonth(delta){currentMonth+=delta;if(currentMonth===0){currentMonth=12;currentYear--;}if(currentMonth===13){currentMonth=1;currentYear++;}loadSchedule();}
function logout(){token=null;workNumber.value='';scheduleView.classList.add('hidden');loginView.classList.remove('hidden');calendar.innerHTML='';scheduleNotice.classList.add('hidden');}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
