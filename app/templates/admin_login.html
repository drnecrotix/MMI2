<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MMI2 Admin Login</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#08101d;--panel:#101a2b;--border:#263750;--text:#eef5ff;--muted:#93a5bd;--accent:#4f7cff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#12213a,#08101d 45%);color:var(--text)}
    .card{width:min(440px,calc(100% - 28px));background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:0 20px 60px #0007}h1{margin:0 0 8px}.muted{color:var(--muted);margin:0 0 20px}label{display:block;margin:12px 0 6px;color:var(--muted);font-size:13px;font-weight:700}input,button{font:inherit;width:100%;border-radius:12px;padding:13px}input{background:#091321;color:#fff;border:1px solid #32445f}button{margin-top:16px;border:0;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.status{min-height:22px;margin-top:12px;color:#ffb477}a{color:#9bb4ff}
  </style>
</head>
<body><section class="card">
  <h1>MMI2 Admin</h1><p class="muted">Вход в административния панел.</p>
  <label for="username">Потребител</label><input id="username" autocomplete="username">
  <label for="password">Парола</label><input id="password" type="password" autocomplete="current-password">
  <button id="loginButton" onclick="login()">Вход</button><div id="status" class="status"></div>
  <p><a href="/">← Към графика</a></p>
<script>
const STORAGE='mmi2_admin_token';
async function validateExisting(){const token=sessionStorage.getItem(STORAGE);if(!token)return;const r=await fetch('/api/v1/admin/me',{headers:{Authorization:`Bearer ${token}`}});if(r.ok)location.replace('/admin');else sessionStorage.removeItem(STORAGE);}
async function login(){const button=document.getElementById('loginButton');button.disabled=true;status.textContent='Проверка...';try{const r=await fetch('/api/v1/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Неуспешен вход.');sessionStorage.setItem(STORAGE,d.access_token);location.replace('/admin');}catch(e){status.textContent=e.message;button.disabled=false;}}
password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});validateExisting();
</script></section></body></html>
